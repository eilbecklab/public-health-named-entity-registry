name: Prepare release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version
        required: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: phner release prepare --version "${{ inputs.version }}"
      - run: phner release verify build/
      - uses: actions/upload-artifact@v7
        with:
          name: phner-${{ inputs.version }}
          path: build/

