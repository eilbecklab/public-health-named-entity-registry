name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: linkml-validate src/public_health_named_entity_registry/schema/public_health_named_entity_registry.yaml
      - run: phner validate registry
      - run: pytest
      - run: ruff check .
      - run: mypy
      - run: phner generate-schema
