[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "public-health-named-entity-registry"
version = "0.1.0"
description = "A LinkML-governed, manually curated public health named entity registry."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "PHNER contributors" }]
dependencies = [
  "linkml-runtime>=1.9,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "linkml>=1.9,<2",
  "mypy>=1.15",
  "pre-commit>=4",
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
phner = "public_health_named_entity_registry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/public_health_named_entity_registry"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["public_health_named_entity_registry"]
